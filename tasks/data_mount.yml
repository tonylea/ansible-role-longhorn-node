- name: Format Longhorn's storage
  community.general.filesystem:
    dev: "{{ longhorn_node_data_device }}"
    fstype: ext4

- name: Read the UUID of Longhorn's storage
  ansible.builtin.command: blkid --match-tag UUID --output value {{ longhorn_node_data_device }}
  register: longhorn_node_data_uuid
  changed_when: false

- name: Mount Longhorn's storage
  ansible.posix.mount:
    src: UUID={{ longhorn_node_data_uuid.stdout }}
    path: "{{ longhorn_node_data_path }}"
    fstype: ext4
    opts: defaults
    state: mounted

- name: Create the k3s config drop-in directory
  ansible.builtin.file:
    path: /etc/rancher/k3s/config.yaml.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# node-label+ appends to labels set elsewhere instead of replacing them.
# k3s only applies node labels when a node first registers.
- name: Label the node for a Longhorn default disk
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml.d/longhorn.yaml
    content: |
      node-label+:
        - node.longhorn.io/create-default-disk=true
    owner: root
    group: root
    mode: "0644"
