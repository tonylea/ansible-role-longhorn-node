- name: Install Longhorn's prerequisites
  ansible.builtin.apt:
    name: [open-iscsi, nfs-common]
    state: present

- name: Keep the iSCSI daemon running
  ansible.builtin.systemd_service:
    name: iscsid
    enabled: true
    state: started

- name: Load dm_crypt now and at every boot
  community.general.modprobe:
    name: dm_crypt
    persistent: present

- name: Give Longhorn a data partition
  ansible.builtin.import_tasks: data_disk.yml
  when: longhorn_node_data_disk | bool
