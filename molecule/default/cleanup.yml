- name: Cleanup
  hosts: all
  gather_facts: false
  tasks:
    # Molecule also runs this before the container exists, when there is nothing to clean up.
    - name: Check the test machine exists
      ansible.builtin.ping:
      register: machine
      ignore_unreachable: true

    - name: Stop when there is no test machine
      ansible.builtin.meta: end_play
      when: machine.unreachable | default(false)

    - name: Find the test disk
      ansible.builtin.command: losetup --noheadings --output NAME --associated /var/tmp/test-disk.img
      register: test_disk
      changed_when: false
      failed_when: false

    - name: Unmount the test disk's partitions
      ansible.posix.mount:
        path: "{{ item }}"
        state: unmounted
      loop: [/var/lib/longhorn, /mnt/test-root]

    - name: Detach the test disk
      ansible.builtin.command: losetup --detach {{ test_disk.stdout }}
      when: test_disk.stdout | length > 0
      changed_when: true
