- name: Converge the partition test
  hosts: partition
  become: true
  pre_tasks:
    - name: Find the test disk's root partition
      ansible.builtin.command: findmnt --noheadings --output SOURCE /mnt/test-root
      register: test_root
      changed_when: false
  roles:
    - role: tonylea.longhorn_node
      vars:
        longhorn_node_root_device: "{{ test_root.stdout }}"

- name: Converge the whole-disk test
  hosts: whole-disk
  become: true
  pre_tasks:
    - name: Find the test disk
      ansible.builtin.command: losetup --noheadings --output NAME --associated {{ test_disk_image }}
      register: test_disk
      changed_when: false
  roles:
    - role: tonylea.longhorn_node
      vars:
        longhorn_node_whole_disk: "{{ test_disk.stdout }}"
